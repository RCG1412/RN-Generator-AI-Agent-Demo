name: Deploy to Staging (Internal)

on:
  push:
    branches: [staging]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm install
      
      - name: Copy internal content to build
        run: |
          if [ -d "internal/user-guides" ] && [ "$(ls -A internal/user-guides 2>/dev/null)" ]; then
            mkdir -p docs/user-guides
            cp -r internal/user-guides/* docs/user-guides/ 2>/dev/null || true
          fi
          if [ -d "internal/release-notes" ] && [ "$(ls -A internal/release-notes 2>/dev/null)" ]; then
            mkdir -p docs/release-notes
            cp -r internal/release-notes/* docs/release-notes/ 2>/dev/null || true
          fi
      
      - name: Build staging website
        run: npm run build
        env:
          DEPLOY_ENV: staging
      
      - name: Deploy to GitHub Pages (Staging)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: staging
          keep_files: true